apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snooker-score-data
  labels:
    app.kubernetes.io/name: snooker-score-tracker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snooker-score-tracker
  labels:
    app.kubernetes.io/name: snooker-score-tracker
spec:
  replicas: 1
  # JSON files are the application's data store. Never run multiple writers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: snooker-score-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snooker-score-tracker
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          # Replace this with the image you build and push to your registry.
          image: ghcr.io/YOUR_GITHUB_USERNAME/snooker-score-tracker:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: score-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: score-data
          persistentVolumeClaim:
            claimName: snooker-score-data
---
apiVersion: v1
kind: Service
metadata:
  name: snooker-score-tracker
  labels:
    app.kubernetes.io/name: snooker-score-tracker
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: snooker-score-tracker
  ports:
    - name: http
      port: 80
      targetPort: http
